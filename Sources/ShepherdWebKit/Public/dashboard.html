<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shepherd</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #222436; --panel: #1e2030; --raised: #2f334d; --line: #3b4261; --fg: #c8d3f5; --dim: #828bb8;
    --accent: #6aa9ff; --needs: #ff8a5c; --done: #4ade80; --working: #6aa9ff; --idle: #6b7280; --warn: #f5c451;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; overflow: hidden; }
  button, select { font: inherit; color: var(--fg); }
  body { display: flex; flex-direction: column; }
  #app { display: flex; flex: 1; min-height: 0; }

  /* omnibar */
  #omniBar { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 15; }
  #omniModes { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .omniMode { background: transparent; border: 0; border-radius: 6px; padding: 3px 10px; color: var(--dim); cursor: pointer; }
  .omniMode.on { background: var(--raised); color: var(--fg); }
  #omni { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); padding: 7px 11px; font: inherit; outline: none; }
  #omni:focus { border-color: var(--accent); }
  #omniHint { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #omniList { position: absolute; left: 14px; right: 14px; top: calc(100% + 4px); max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px #0008; padding: 4px; display: none; }
  #omniList.show { display: block; }
  .omniItem { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: default; }
  .omniItem.sel { background: var(--raised); }
  .omniItem .oTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .omniItem .oSub { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .omniEmpty { color: var(--dim); padding: 10px; }
  .omniAnswer { padding: 10px 12px; white-space: pre-wrap; line-height: 1.45; max-height: 50vh; overflow-y: auto; user-select: text; }
  .omniAnswer .q { color: var(--dim); margin-bottom: 6px; }
  .omniAnswer .hint { color: var(--dim); font-size: 11px; margin-top: 8px; }

  /* sidebar */
  #side { width: 290px; flex: 0 0 290px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  #sideHead { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px; }
  #sideHead h1 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #newBtn { background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  #newBtn:hover { border-color: var(--accent); }
  #list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 9px; cursor: default; border: 1px solid transparent; }
  .row:hover { background: var(--raised); }
  .row.sel { background: var(--raised); border-color: var(--line); }
  .dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; background: var(--idle); }
  .dot.blocked { background: var(--needs); box-shadow: 0 0 0 3px #ff8a5c33; }
  .dot.done { background: var(--done); }
  .dot.working { background: var(--working); animation: pulse 1.4s ease-in-out infinite; }
  .dot.unknown, .dot.interrupted { background: transparent; border: 2px solid var(--warn); }
  .dot.interrupted { border-color: var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }
  .rowText { min-width: 0; flex: 1; }
  .rowTitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .rowSub { color: var(--dim); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowSub.needs { color: var(--needs); }
  .key { flex: 0 0 auto; color: var(--dim); font-size: 11px; margin-top: 2px; opacity: .7; }
  #empty { color: var(--dim); padding: 18px 14px; line-height: 1.5; }
  #conn { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 7px; }
  #connDot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  #connDot.ok { background: var(--done); } #connDot.bad { background: var(--needs); }

  /* main */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #head { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 48px; }
  #title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--raised); color: var(--dim); white-space: nowrap; }
  #chip.blocked { color: var(--needs); } #chip.done { color: var(--done); } #chip.working { color: var(--working); } #chip.interrupted { color: var(--warn); }
  #spacer { flex: 1; }
  #meta { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .btn { background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  .btn.danger:hover { border-color: var(--needs); color: var(--needs); }
  #stage { flex: 1; min-height: 0; position: relative; }
  #termWrap { position: absolute; inset: 0; padding: 8px 6px 4px 10px; }
  #term { width: 100%; height: 100%; }
  #placeholder { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--dim); line-height: 1.6; padding: 24px; }
  #placeholder.show { display: flex; }
  #placeholder .btn { margin-top: 10px; }
  #banner { display: none; position: absolute; left: 0; right: 0; top: 0; z-index: 5; padding: 6px 12px; background: #5a2b1d; color: #ffd9cc; text-align: center; font-size: 12px; }
  #banner.show { display: block; }

  /* new session sheet */
  #viewBack { display: none; position: fixed; inset: 0; background: #0009; z-index: 22; align-items: center; justify-content: center; }
  #viewBack.show { display: flex; }
  #viewBox { width: min(860px, 92vw); max-height: 84vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  #viewBox h2 { margin: 0 0 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #viewText { flex: 1; overflow: auto; white-space: pre-wrap; margin: 0; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--fg); }
  .subRow { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .pastRow { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .pastRow .pastMeta { color: var(--dim); font-size: 11px; margin: 2px 0 4px; word-break: break-all; }
  .pastRow .btn { padding: 2px 8px; margin-right: 6px; }
  .parentChip { color: var(--dim); font-size: 11px; margin-top: 3px; }
  #sheetBack { display: none; position: fixed; inset: 0; background: #0009; z-index: 20; align-items: flex-start; justify-content: center; padding-top: 14vh; }
  #sheetBack.show { display: flex; }
  #sheet { width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  #sheet h2 { margin: 0 0 12px; font-size: 14px; }
  #sheet label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  #sheet select, #sheet input { width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; color: var(--fg); font: inherit; }
  #sheetButtons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #sheetError { color: var(--needs); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* view tabs */
  #tabs { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tab { background: transparent; border: 0; border-radius: 6px; padding: 3px 10px; cursor: pointer; color: var(--dim); }
  .tab.on { background: var(--raised); color: var(--fg); }

  /* board */
  #boardView { display: none; flex: 1; min-height: 0; flex-direction: column; position: relative; }
  body.board #boardView { display: flex; }
  body.board #head, body.board #stage { display: none; }
  body.board #side { width: 230px; flex-basis: 230px; }
  #boardBar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #boardBar input { flex: 1; max-width: 460px; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; color: var(--fg); font: inherit; }
  #boardBar select { max-width: 200px; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
  #boardHint { margin-left: auto; color: var(--dim); font-size: 12px; }
  #columns { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 12px 14px 14px; overflow-x: auto; }
  .col { flex: 1 1 160px; min-width: 160px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; }
  .col.over { border-color: var(--accent); background: #18202f; }
  .col.needs { border-color: #ff8a5c55; }
  .colHead { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; }
  .colHead h3 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .colHead span { color: var(--dim); font-size: 12px; }
  .cards { flex: 1; overflow-y: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 7px; }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; cursor: default; }
  .card:hover { border-color: #3a4152; }
  .card.sel { border-color: var(--accent); }
  .card.untracked { border-style: dashed; background: transparent; }
  .card.dragging { opacity: .4; }
  .cardTitle { font-weight: 500; line-height: 1.3; }
  .cardTitle .num { color: var(--dim); font-weight: 400; margin-right: 5px; }
  .cardObj { color: var(--dim); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cardMeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--dim); }
  .chipSm { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 99px; background: var(--bg); }
  .chipSm .dot { margin: 0; width: 7px; height: 7px; }
  .bar { width: 46px; height: 4px; border-radius: 2px; background: var(--bg); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .cardActions { display: flex; gap: 6px; margin-top: 8px; }
  .cardActions .btn { padding: 2px 9px; font-size: 12px; }
  a.pr { color: var(--accent); text-decoration: none; }

  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 380px; background: var(--panel); border-left: 1px solid var(--line); display: none; flex-direction: column; z-index: 6; }
  #drawer.show { display: flex; }
  #drawerHead { padding: 14px 16px 8px; display: flex; gap: 8px; align-items: flex-start; }
  #drawerTitle { flex: 1; font-size: 15px; font-weight: 600; line-height: 1.3; }
  #drawerClose { background: transparent; border: 0; color: var(--dim); font-size: 18px; cursor: pointer; }
  #drawerBody { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  #drawerBody h4 { margin: 16px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #drawerBody p { margin: 0; line-height: 1.45; white-space: pre-wrap; }
  .step { display: flex; gap: 8px; padding: 2px 0; line-height: 1.4; }
  .step.done { color: var(--dim); text-decoration: line-through; }
  .logLine { color: var(--dim); font-size: 12px; padding: 2px 0; line-height: 1.4; }
  #drawerButtons { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  #drawerButtons select { background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
  .sessLink { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  .sessLink:hover { color: var(--accent); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #3a1d14; color: #ffd9cc; border: 1px solid #ff8a5c66; padding: 8px 14px; border-radius: 9px; font-size: 12px; display: none; z-index: 40; max-width: 70vw; }
  #toast.show { display: block; }
</style>
</head>
<body>
<div id="omniBar">
  <div id="omniModes"><button class="omniMode on" data-mode="switch" title="Find a session or task">Switch</button><button class="omniMode" data-mode="new" title="New session (+)">New</button><button class="omniMode" data-mode="task" title="Capture a task (#)">Task</button><button class="omniMode" data-mode="ask" title="Ask Claude a quick question (?)">Ask</button><button class="omniMode" data-mode="review" title="Pull requests to review (!)">Review</button></div>
  <input id="omni" autocomplete="off" spellcheck="false">
  <span id="omniHint"></span>
  <div id="omniList"></div>
</div>
<div id="app">
  <aside id="side">
    <div id="sideHead"><div id="tabs"><button class="tab on" id="tabSessions">Sessions</button><button class="tab" id="tabBoard" title="⌘B">Board</button></div><button id="newBtn" title="New session (⌘N)">+ New</button></div>
    <div id="list"></div>
    <div id="conn"><span id="connDot"></span><span id="connText">connecting…</span></div>
  </aside>
  <section id="main">
    <div id="head">
      <span id="title">Shepherd</span><span id="chip" hidden></span>
      <span id="spacer"></span>
      <span id="meta"></span>
      <button id="resumeBtn" class="btn primary" hidden>Resume</button>
      <button id="doneBtn" class="btn primary" hidden title="Finish this task: its session writes a result, then ends">Done</button>
      <button id="closeBtn" class="btn" hidden title="End this session but keep the task open">End session</button>
    </div>
    <div id="stage">
      <div id="banner">Disconnected, reconnecting…</div>
      <div id="termWrap"><div id="term"></div></div>
      <div id="placeholder"><div id="placeholderText"></div></div>
    </div>

    <div id="boardView">
      <div id="boardBar">
        <input id="newTask" placeholder="New task, then Enter" autocomplete="off">
        <select id="newTaskProject" title="Folder the task starts in"></select>
        <span id="boardHint">Tab or arrows move · Space details · Enter opens · E edit · S subtask · D done · [ ] status</span>
      </div>
      <div id="columns"></div>
      <div id="drawer">
        <div id="drawerHead"><div id="drawerTitle"></div><button id="drawerClose" title="Close (Esc)">×</button></div>
        <div id="drawerBody"></div>
        <div id="drawerButtons"></div>
      </div>
    </div>
  </section>
</div>
<div id="toast"></div>
<div id="viewBack"><div id="viewBox"><h2><span id="viewTitle"></span><button class="btn" id="viewClose">Close (Esc)</button></h2><pre id="viewText"></pre></div></div>
<div id="sheetBack">
  <div id="sheet">
    <h2>New Claude session</h2>
    <label for="proj">Project</label>
    <select id="proj"></select>
    <label for="sheetTitle">Title (optional)</label>
    <input id="sheetTitle" placeholder="Shown in the list" autocomplete="off">
    <div id="sheetError"></div>
    <div id="sheetButtons"><button id="sheetCancel" class="btn">Cancel</button><button id="sheetStart" class="btn primary">Start</button></div>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const enc = new TextEncoder();
  const native = (msg) => { try { window.webkit.messageHandlers.native.postMessage(msg); } catch {} };
  const hosted = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native);

  // ---- state --------------------------------------------------------------------------------------
  let sessions = [];            // from /api/sessions, in the server's attention order
  let holders = [];             // from the bridge's `list`
  let selected = null;          // Claude session id
  let attachedHolder = null;    // holder id this page is attached to
  let ws = null, alive = false, lastRx = 0, hbTimer = null, retryTimer = null, retries = 0, myId = null, driver = null;
  let pendingSelectHolder = null;
  const holderOf = (sid) => holders.find((h) => h.claudeSessionID === sid && h.liveness === "live");
  const interruptedOf = (sid) => holders.find((h) => h.claudeSessionID === sid && h.liveness === "interrupted");
  const sessionById = (sid) => sessions.find((s) => s.id === sid);

  // ---- terminal -----------------------------------------------------------------------------------
  function openLink(uri) { if (hosted) native({ type: "openURL", uri }); else window.open(uri, "_blank"); }
  const term = new Terminal({
    fontSize: 15, fontFamily: '"JetBrains Mono", "SF Mono", Menlo, ui-monospace, monospace', fontWeight: "500", fontWeightBold: "700", scrollback: 5000, cursorBlink: true, scrollSensitivity: 2, fastScrollSensitivity: 6,
    allowProposedApi: true, macOptionIsMeta: true, macOptionClickForcesSelection: true,
    theme: {
      background: "#222436", foreground: "#c8d3f5", cursor: "#c8d3f5", cursorAccent: "#222436", selectionBackground: "#2d3f76", selectionForeground: "#c8d3f5",
      black: "#1b1d2b", red: "#ff757f", green: "#c3e88d", yellow: "#ffc777", blue: "#82aaff", magenta: "#c099ff", cyan: "#86e1fc", white: "#828bb8",
      brightBlack: "#444a73", brightRed: "#ff757f", brightGreen: "#c3e88d", brightYellow: "#ffc777", brightBlue: "#82aaff", brightMagenta: "#c099ff", brightCyan: "#86e1fc", brightWhite: "#c8d3f5",
    },
    linkHandler: { activate: (_e, text) => openLink(text), allowNonHttpProtocols: false },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon((_e, uri) => openLink(uri)));
  term.open($("term"));

  function proposed() { try { const d = fit.proposeDimensions(); return d && d.cols > 1 ? { cols: d.cols, rows: d.rows } : { cols: 100, rows: 30 }; } catch { return { cols: 100, rows: 30 }; } }
  let view = "sessions";
  function focusTerm() { if (document.activeElement && document.activeElement.id === "omni") return; if (view === "sessions" && !$("sheetBack").classList.contains("show") && document.hasFocus()) term.focus(); }
  function sendCtl(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function sendBytes(str) { if (ws && ws.readyState === 1 && attachedHolder) ws.send(enc.encode(str)); }
  window.__send = sendBytes;   // the native host types dropped file paths through this

  let typedAt = 0, sizeText = "";
  term.onData((d) => { if (!typedAt) typedAt = performance.now(); sendBytes(d); });
  function showMeta(extra) { $("meta").textContent = sizeText + (extra ? " · " + extra : ""); }
  term.attachCustomKeyEventHandler((e) => {
    // Shift+Enter: Claude Code expects ESC CR (what Option+Enter sends) for a newline; a plain CR submits. xterm runs this
    // handler for keydown and for the keypress after it, so both are swallowed or the keypress still submits.
    if (e.key === "Enter" && e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) { if (e.type === "keydown") sendBytes("\x1b\r"); return false; }
    // our own shortcuts must not also be typed into the agent
    if (e.metaKey && !e.ctrlKey && !e.altKey && (/^[1-9]$/.test(e.key) || e.key === "n" || e.key === "b" || e.key === "k")) return false;
    return true;
  });
  // A full-screen program that tracks the mouse scrolls itself, so the wheel has to reach it as mouse events. xterm sends
  // one per whole line of movement, which feels slow with a trackpad; this sends one per fraction of a line instead.
  let wheelRemainder = 0;
  $("term").addEventListener("wheel", (e) => {
    if (term.modes.mouseTrackingMode === "none" || e.ctrlKey) return;
    e.preventDefault(); e.stopPropagation();
    const screen = term.element.querySelector(".xterm-screen"); if (!screen) return;
    const box = screen.getBoundingClientRect(), cellH = box.height / term.rows, cellW = box.width / term.cols;
    const px = e.deltaMode === 1 ? e.deltaY * cellH : e.deltaMode === 2 ? e.deltaY * box.height : e.deltaY;
    wheelRemainder += px / (cellH * 0.6);
    const n = Math.max(-8, Math.min(8, Math.trunc(wheelRemainder)));
    if (!n) return;
    wheelRemainder -= n;
    const col = Math.max(1, Math.min(term.cols, Math.floor((e.clientX - box.left) / cellW) + 1));
    const row = Math.max(1, Math.min(term.rows, Math.floor((e.clientY - box.top) / cellH) + 1));
    sendBytes(("\x1b[<" + (n < 0 ? 64 : 65) + ";" + col + ";" + row + "M").repeat(Math.abs(n)));
  }, { capture: true, passive: false });

  // Cmd+V with an image and no text: Ctrl+V makes Claude Code read the clipboard image itself.
  $("term").addEventListener("paste", (e) => {
    const cd = e.clipboardData;
    const hasImage = [...(cd?.files ?? [])].some((f) => f.type.startsWith("image/")) || [...(cd?.items ?? [])].some((i) => i.type.startsWith("image/"));
    if (hasImage && !(cd?.getData("text/plain") ?? "")) { e.preventDefault(); e.stopPropagation(); sendBytes("\x16"); }
  }, true);

  let resizeTimer = null;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!attachedHolder || $("termWrap").clientWidth < 50 || $("termWrap").clientHeight < 50) return;
      try { fit.fit(); } catch {}
      const d = proposed();
      sendCtl({ type: "resize", cols: d.cols, rows: d.rows });
    }, 120);
  }
  new ResizeObserver(onResize).observe($("termWrap"));

  // ---- connection ---------------------------------------------------------------------------------
  function setAlive(on) {
    alive = on;
    $("connDot").className = on ? "ok" : "bad";
    $("connText").textContent = on ? "live" : "reconnecting…";
    $("banner").classList.toggle("show", !on);
  }
  function connect() {
    if (ws) { ws.onclose = null; ws.onmessage = null; try { ws.close(); } catch {} }

    const context = underContext ? contextTaskId() : null;
    const parent = context == null ? null : topLevel(context);
    if (underContext && parent == null) { toast("There is no task here to put it under."); return; }
    try {
      const t = await api("/api/tasks", "POST", parent == null ? { title } : { title, parent_id: parent });
      toast("Task #" + t.id + " added");
      $("omni").value = ""; setOmniMode("switch");
      if (andStart) { await startTask(t); leaveOmni(); } else { loadTasks(); }
    } catch (e) { toast(e.message); }
  }
  function runOmni() {
    if (omniMode === "task") return addTask(false, false);
    if (omniMode === "ask") return runAsk();
    const it = omniItems[omniIndex]; if (!it) return;
    closeOmni(); $("omni").value = ""; searchHits = []; setOmniMode("switch");
    it.run(); leaveOmni();
  }
  // Leaves the bar for whatever it started: the terminal, unless the board is what is showing.
  function leaveOmni() { $("omni").blur(); closeOmni(); setTimeout(focusTerm, 60); }
  function focusOmni() { $("omni").focus(); $("omni").select(); setOmniMode(omniMode, true); }

  $("omni").addEventListener("focus", () => { if (omniMode === "switch") loadTasks(); renderOmni(); });
  $("omni").addEventListener("blur", () => closeOmni());
  $("omni").addEventListener("input", () => {
    const v = $("omni").value;
    if (v.length === 1 && (v === "+" || v === "#" || v === "?" || v === "!")) { setOmniMode({ "+": "new", "#": "task", "?": "ask", "!": "review" }[v]); return; }
    omniIndex = 0; renderOmni();
    if (omniMode === "switch") scheduleSearch();
  });
  $("omni").addEventListener("keydown", (e) => {
    if (e.key === "Tab") { e.preventDefault(); const i = MODES.indexOf(omniMode); setOmniMode(MODES[(i + (e.shiftKey ? MODES.length - 1 : 1)) % MODES.length]); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); omniIndex = Math.min(omniItems.length - 1, omniIndex + 1); renderOmni(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); omniIndex = Math.max(0, omniIndex - 1); renderOmni(); return; }
    if (e.key === "Enter" && omniMode === "switch" && e.metaKey) { e.preventDefault(); const it = omniItems[omniIndex]; if (it && it.kind === "task") { closeOmni(); $("omni").value = ""; searchHits = []; setOmniMode("switch"); pickUpFresh(it.taskId); leaveOmni(); } return; }
    if (e.key === "Enter" && omniMode === "ask" && e.metaKey) { e.preventDefault(); continueAsk(); return; }
    if (e.key === "Enter" && omniMode === "review") { e.preventDefault(); const it = omniItems[omniIndex]; if (it && it.pr) { closeOmni(); $("omni").value = ""; setOmniMode("switch"); if (e.metaKey) it.run(); else openLink(it.pr.url); leaveOmni(); } return; }
    if (e.key === "Enter") { e.preventDefault(); if (omniMode === "task" && e.metaKey && e.shiftKey) addTask(false, true); else if (omniMode === "task" && e.metaKey) addTask(true, false); else runOmni(); return; }
    if (e.key === "d" && e.metaKey && omniMode === "switch") {
      e.preventDefault();
      const it = omniItems[omniIndex]; if (it && it.taskId != null) { closeOmni(); doDone(it.taskId, it.title); }
      return;
    }
    if (e.key === "Backspace" && e.metaKey && omniMode === "review") { e.preventDefault(); const it = omniItems[omniIndex]; if (it && it.pr) ignoreReview(it.pr); return; }
    if (e.key === "Backspace" && !$("omni").value && omniMode !== "switch") { e.preventDefault(); setOmniMode("switch"); return; }
    if (e.key === "Escape") { e.preventDefault(); if ($("omni").value) { $("omni").value = ""; renderOmni(); } else if (omniMode === "ask" && askState) { askState = null; renderOmni(); } else leaveOmni(); }
  });
  for (const b of document.querySelectorAll(".omniMode")) b.addEventListener("mousedown", (e) => { e.preventDefault(); setOmniMode(b.dataset.mode); $("omni").focus(); });
  window.addEventListener("keydown", (e) => {
    if (e.metaKey && !e.ctrlKey && !e.altKey && e.key === "k") { e.preventDefault(); focusOmni(); }
  }, true);
  setOmniMode("switch");
  closeOmni();

  // Reports a stretch where the page did not draw, with what it had just been asked to do (the host writes it to a log).
  let lastFrame = performance.now(), lastAction = "";
  const noteAction = (what) => { lastAction = what + " @" + Math.round(performance.now()); };
  for (const type of ["keydown", "mousedown"]) window.addEventListener(type, (e) => noteAction(type + " " + (e.key || "")), true);
  document.addEventListener("visibilitychange", () => { lastFrame = performance.now(); });
  (function watchFrames(now) {
    const gap = now - lastFrame; lastFrame = now;
    if (gap > 300 && document.visibilityState === "visible" && document.hasFocus()) native({ type: "stall", ms: Math.round(gap), after: lastAction });
    requestAnimationFrame(watchFrames);
  })(performance.now());

  if (location.hash === "#board") setView("board");
  watchEvents();
  connect();
  refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
