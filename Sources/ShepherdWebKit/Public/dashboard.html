<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shepherd</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #161920; --raised: #1d212a; --line: #262b36; --fg: #e6e8ee; --dim: #8b93a3;
    --accent: #6aa9ff; --needs: #ff8a5c; --done: #4ade80; --working: #6aa9ff; --idle: #6b7280; --warn: #f5c451;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; overflow: hidden; }
  button, select { font: inherit; color: var(--fg); }
  #app { display: flex; height: 100%; }

  /* sidebar */
  #side { width: 290px; flex: 0 0 290px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  #sideHead { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px; }
  #sideHead h1 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #newBtn { background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  #newBtn:hover { border-color: var(--accent); }
  #list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 9px; cursor: default; border: 1px solid transparent; }
  .row:hover { background: var(--raised); }
  .row.sel { background: var(--raised); border-color: var(--line); }
  .dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; background: var(--idle); }
  .dot.blocked { background: var(--needs); box-shadow: 0 0 0 3px #ff8a5c33; }
  .dot.done { background: var(--done); }
  .dot.working { background: var(--working); animation: pulse 1.4s ease-in-out infinite; }
  .dot.unknown, .dot.interrupted { background: transparent; border: 2px solid var(--warn); }
  .dot.interrupted { border-color: var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }
  .rowText { min-width: 0; flex: 1; }
  .rowTitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .rowSub { color: var(--dim); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowSub.needs { color: var(--needs); }
  .key { flex: 0 0 auto; color: var(--dim); font-size: 11px; margin-top: 2px; opacity: .7; }
  #empty { color: var(--dim); padding: 18px 14px; line-height: 1.5; }
  #conn { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 7px; }
  #connDot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  #connDot.ok { background: var(--done); } #connDot.bad { background: var(--needs); }

  /* main */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #head { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 48px; }
  #title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--raised); color: var(--dim); white-space: nowrap; }
  #chip.blocked { color: var(--needs); } #chip.done { color: var(--done); } #chip.working { color: var(--working); } #chip.interrupted { color: var(--warn); }
  #spacer { flex: 1; }
  #meta { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .btn { background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  .btn.danger:hover { border-color: var(--needs); color: var(--needs); }
  #stage { flex: 1; min-height: 0; position: relative; }
  #termWrap { position: absolute; inset: 0; padding: 8px 6px 4px 10px; }
  #term { width: 100%; height: 100%; }
  #placeholder { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--dim); line-height: 1.6; padding: 24px; }
  #placeholder.show { display: flex; }
  #placeholder .btn { margin-top: 10px; }
  #banner { display: none; position: absolute; left: 0; right: 0; top: 0; z-index: 5; padding: 6px 12px; background: #5a2b1d; color: #ffd9cc; text-align: center; font-size: 12px; }
  #banner.show { display: block; }

  /* new session sheet */
  #sheetBack { display: none; position: fixed; inset: 0; background: #0009; z-index: 20; align-items: flex-start; justify-content: center; padding-top: 14vh; }
  #sheetBack.show { display: flex; }
  #sheet { width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  #sheet h2 { margin: 0 0 12px; font-size: 14px; }
  #sheet label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  #sheet select, #sheet input { width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; color: var(--fg); font: inherit; }
  #sheetButtons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #sheetError { color: var(--needs); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* view tabs */
  #tabs { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tab { background: transparent; border: 0; border-radius: 6px; padding: 3px 10px; cursor: pointer; color: var(--dim); }
  .tab.on { background: var(--raised); color: var(--fg); }

  /* board */
  #boardView { display: none; flex: 1; min-height: 0; flex-direction: column; position: relative; }
  body.board #boardView { display: flex; }
  body.board #head, body.board #stage { display: none; }
  body.board #side { width: 230px; flex-basis: 230px; }
  #boardBar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #boardBar input { flex: 1; max-width: 460px; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; color: var(--fg); font: inherit; }
  #boardBar select { max-width: 200px; background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
  #boardHint { margin-left: auto; color: var(--dim); font-size: 12px; }
  #columns { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 12px 14px 14px; overflow-x: auto; }
  .col { flex: 1 1 160px; min-width: 160px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; }
  .col.over { border-color: var(--accent); background: #18202f; }
  .col.needs { border-color: #ff8a5c55; }
  .colHead { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; }
  .colHead h3 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .colHead span { color: var(--dim); font-size: 12px; }
  .cards { flex: 1; overflow-y: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 7px; }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; cursor: default; }
  .card:hover { border-color: #3a4152; }
  .card.sel { border-color: var(--accent); }
  .card.untracked { border-style: dashed; background: transparent; }
  .card.dragging { opacity: .4; }
  .cardTitle { font-weight: 500; line-height: 1.3; }
  .cardTitle .num { color: var(--dim); font-weight: 400; margin-right: 5px; }
  .cardObj { color: var(--dim); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cardMeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--dim); }
  .chipSm { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 99px; background: var(--bg); }
  .chipSm .dot { margin: 0; width: 7px; height: 7px; }
  .bar { width: 46px; height: 4px; border-radius: 2px; background: var(--bg); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .cardActions { display: flex; gap: 6px; margin-top: 8px; }
  .cardActions .btn { padding: 2px 9px; font-size: 12px; }
  a.pr { color: var(--accent); text-decoration: none; }

  #drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 380px; background: var(--panel); border-left: 1px solid var(--line); display: none; flex-direction: column; z-index: 6; }
  #drawer.show { display: flex; }
  #drawerHead { padding: 14px 16px 8px; display: flex; gap: 8px; align-items: flex-start; }
  #drawerTitle { flex: 1; font-size: 15px; font-weight: 600; line-height: 1.3; }
  #drawerClose { background: transparent; border: 0; color: var(--dim); font-size: 18px; cursor: pointer; }
  #drawerBody { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  #drawerBody h4 { margin: 16px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #drawerBody p { margin: 0; line-height: 1.45; white-space: pre-wrap; }
  .step { display: flex; gap: 8px; padding: 2px 0; line-height: 1.4; }
  .step.done { color: var(--dim); text-decoration: line-through; }
  .logLine { color: var(--dim); font-size: 12px; padding: 2px 0; line-height: 1.4; }
  #drawerButtons { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  #drawerButtons select { background: var(--raised); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
  .sessLink { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  .sessLink:hover { color: var(--accent); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #3a1d14; color: #ffd9cc; border: 1px solid #ff8a5c66; padding: 8px 14px; border-radius: 9px; font-size: 12px; display: none; z-index: 40; max-width: 70vw; }
  #toast.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="sideHead"><div id="tabs"><button class="tab on" id="tabSessions">Sessions</button><button class="tab" id="tabBoard" title="⌘B">Board</button></div><button id="newBtn" title="New session (⌘N)">+ New</button></div>
    <div id="list"></div>
    <div id="conn"><span id="connDot"></span><span id="connText">connecting…</span></div>
  </aside>
  <section id="main">
    <div id="head">
      <span id="title">Shepherd</span><span id="chip" hidden></span>
      <span id="spacer"></span>
      <span id="meta"></span>
      <button id="resumeBtn" class="btn primary" hidden>Resume</button>
      <button id="closeBtn" class="btn danger" hidden title="End this session">Close session</button>
    </div>
    <div id="stage">
      <div id="banner">Disconnected, reconnecting…</div>
      <div id="termWrap"><div id="term"></div></div>
      <div id="placeholder"><div id="placeholderText"></div></div>
    </div>

    <div id="boardView">
      <div id="boardBar">
        <input id="newTask" placeholder="New task, then Enter" autocomplete="off">
        <select id="newTaskProject" title="Folder the task starts in"></select>
        <span id="boardHint">Drag to move · Enter starts · [ ] changes status</span>
      </div>
      <div id="columns"></div>
      <div id="drawer">
        <div id="drawerHead"><div id="drawerTitle"></div><button id="drawerClose" title="Close (Esc)">×</button></div>
        <div id="drawerBody"></div>
        <div id="drawerButtons"></div>
      </div>
    </div>
  </section>
</div>
<div id="toast"></div>
<div id="sheetBack">
  <div id="sheet">
    <h2>New Claude session</h2>
    <label for="proj">Project</label>
    <select id="proj"></select>
    <label for="sheetTitle">Title (optional)</label>
    <input id="sheetTitle" placeholder="Shown in the list" autocomplete="off">
    <div id="sheetError"></div>
    <div id="sheetButtons"><button id="sheetCancel" class="btn">Cancel</button><button id="sheetStart" class="btn primary">Start</button></div>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const enc = new TextEncoder();
  const native = (msg) => { try { window.webkit.messageHandlers.native.postMessage(msg); } catch {} };
  const hosted = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native);

  // ---- state --------------------------------------------------------------------------------------
  let sessions = [];            // from /api/sessions, in the server's attention order
  let holders = [];             // from the bridge's `list`
  let selected = null;          // Claude session id
  let attachedHolder = null;    // holder id this page is attached to
  let ws = null, alive = false, lastRx = 0, hbTimer = null, retryTimer = null, retries = 0, myId = null, driver = null;
  let pendingSelectHolder = null;
  const holderOf = (sid) => holders.find((h) => h.claudeSessionID === sid && h.liveness === "live");
  const interruptedOf = (sid) => holders.find((h) => h.claudeSessionID === sid && h.liveness === "interrupted");
  const sessionById = (sid) => sessions.find((s) => s.id === sid);

  // ---- terminal -----------------------------------------------------------------------------------
  function openLink(uri) { if (hosted) native({ type: "openURL", uri }); else window.open(uri, "_blank"); }
  const term = new Terminal({
    fontSize: 13, fontFamily: '"SF Mono", Menlo, ui-monospace, monospace', scrollback: 5000, cursorBlink: true,
    allowProposedApi: true, macOptionIsMeta: true, macOptionClickForcesSelection: true,
    theme: { background: "#0f1115", foreground: "#e6e8ee", cursor: "#e6e8ee", selectionBackground: "#3a4a6b" },
    linkHandler: { activate: (_e, text) => openLink(text), allowNonHttpProtocols: false },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon((_e, uri) => openLink(uri)));
  term.open($("term"));

  function proposed() { try { const d = fit.proposeDimensions(); return d && d.cols > 1 ? { cols: d.cols, rows: d.rows } : { cols: 100, rows: 30 }; } catch { return { cols: 100, rows: 30 }; } }
  function sendCtl(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function sendBytes(str) { if (ws && ws.readyState === 1 && attachedHolder) ws.send(enc.encode(str)); }
  window.__send = sendBytes;   // the native host types dropped file paths through this

  term.onData(sendBytes);
  term.attachCustomKeyEventHandler((e) => {
    // Shift+Enter: Claude Code expects ESC CR (what Option+Enter sends) for a newline; a plain CR submits. xterm runs this
    // handler for keydown and for the keypress after it, so both are swallowed or the keypress still submits.
    if (e.key === "Enter" && e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) { if (e.type === "keydown") sendBytes("\x1b\r"); return false; }
    // our own shortcuts must not also be typed into the agent
    if (e.metaKey && !e.ctrlKey && !e.altKey && (/^[1-9]$/.test(e.key) || e.key === "n" || e.key === "b")) return false;
    return true;
  });
  // Cmd+V with an image and no text: Ctrl+V makes Claude Code read the clipboard image itself.
  $("term").addEventListener("paste", (e) => {
    const cd = e.clipboardData;
    const hasImage = [...(cd?.files ?? [])].some((f) => f.type.startsWith("image/")) || [...(cd?.items ?? [])].some((i) => i.type.startsWith("image/"));
    if (hasImage && !(cd?.getData("text/plain") ?? "")) { e.preventDefault(); e.stopPropagation(); sendBytes("\x16"); }
  }, true);

  let resizeTimer = null;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!attachedHolder) return;
      try { fit.fit(); } catch {}
      const d = proposed();
      sendCtl({ type: "resize", cols: d.cols, rows: d.rows });
    }, 120);
  }
  new ResizeObserver(onResize).observe($("termWrap"));

  // ---- connection ---------------------------------------------------------------------------------
  function setAlive(on) {
    alive = on;
    $("connDot").className = on ? "ok" : "bad";
    $("connText").textContent = on ? "live" : "reconnecting…";
    $("banner").classList.toggle("show", !on);
  }
  function connect() {
    if (ws) { ws.onclose = null; ws.onmessage = null; try { ws.close(); } catch {} }
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws", ["shepherd-v1"]);
    ws.binaryType = "arraybuffer";
    const mine = ws;
    ws.onopen = () => { retries = 0; lastRx = Date.now(); setAlive(true); sendCtl({ type: "list" }); refresh(); heartbeat(); };
    ws.onclose = () => { if (mine !== ws) return; attachedHolder = null; retries++; setAlive(false); scheduleReconnect(Math.min(8000, 500 * Math.pow(2, retries - 1))); };
    ws.onerror = () => {};
    ws.onmessage = (ev) => {
      lastRx = Date.now();
      if (typeof ev.data !== "string") { term.write(new Uint8Array(ev.data)); return; }
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      switch (m.type) {
        case "hello": myId = m.you; break;
        case "sessions": holders = m.sessions || []; render(); ensureAttached(); break;
        case "spawned": pendingSelectHolder = m.id; sendCtl({ type: "list" }); refresh(); closeSheet(); break;
        case "attached": term.reset(); term.resize(m.cols, m.rows); break;
        case "ready": if (document.hasFocus()) term.focus(); onResize(); break;
        case "size": driver = m.driver; term.resize(m.cols, m.rows); $("meta").textContent = m.cols + "×" + m.rows; break;
        case "reset": term.reset(); break;
        case "detached": attachedHolder = null; sendCtl({ type: "list" }); refresh(); break;
        case "error": $("sheetError").textContent = m.message; break;
      }
    };
  }
  function scheduleReconnect(delay) { if (retryTimer) return; retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay); }
  // A browser cannot see WebSocket pings, so ask for the list now and then and expect an answer.
  function heartbeat() {
    clearInterval(hbTimer);
    hbTimer = setInterval(() => {
      if (!ws || ws.readyState !== 1) return;
      const sent = Date.now(); sendCtl({ type: "list" });
      setTimeout(() => { if (lastRx < sent && ws && ws.readyState === 1) { try { ws.close(); } catch {} } }, 4000);
    }, 8000);
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (!ws || ws.readyState !== 1)) { clearTimeout(retryTimer); retryTimer = null; connect(); } });

  // ---- data ---------------------------------------------------------------------------------------
  let refreshTimer = null;
  function refresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(async () => {
      try {
        const r = await fetch("/api/sessions");
        sessions = await r.json();
        sendCtl({ type: "list" });
        if (!selected && sessions.length) select(sessions[0].id, { announce: false });
        render();
        if (view === "board") { renderBoard(); }
      } catch {}
    }, 60);
  }
  function watchEvents() {
    const es = new EventSource("/api/events");
    es.onmessage = () => refresh();
    es.onerror = () => {};
  }

  // ---- rendering ----------------------------------------------------------------------------------
  function stateOf(s) { return interruptedOf(s.id) && !holderOf(s.id) ? "interrupted" : s.attention_kind; }
  function labelOf(kind, s) {
    switch (kind) {
      case "blocked": return s.blocker === "needsPermission" ? "Needs permission" : "Waiting for your answer";
      case "done": return "Finished";
      case "working": return "Working";
      case "interrupted": return "Interrupted";
      case "idle": return "Idle";
      default: return "Starting";
    }
  }
  function render() {
    const list = $("list");
    list.textContent = "";
    if (!sessions.length) {
      const e = document.createElement("div"); e.id = "empty";
      e.textContent = "No sessions yet. Start one with + New, or start a task from the panel.";
      list.appendChild(e);
    }
    sessions.forEach((s, i) => {
      const kind = stateOf(s);
      const row = document.createElement("div"); row.className = "row" + (s.id === selected ? " sel" : "");
      const dot = document.createElement("span"); dot.className = "dot " + kind;
      const text = document.createElement("div"); text.className = "rowText";
      const t = document.createElement("div"); t.className = "rowTitle"; t.textContent = s.title;
      const sub = document.createElement("div"); sub.className = "rowSub" + (kind === "blocked" ? " needs" : "");
      sub.textContent = kind === "blocked" ? labelOf(kind, s) + (s.summary ? ": " + s.summary : "") : (s.summary && kind !== "working" ? s.summary : labelOf(kind, s));
      text.append(t, sub);
      row.append(dot, text);
      if (i < 9) { const k = document.createElement("span"); k.className = "key"; k.textContent = "⌘" + (i + 1); row.appendChild(k); }
      row.addEventListener("click", () => select(s.id, { announce: true }));
      list.appendChild(row);
    });
    renderHeader();
  }
  function renderHeader() {
    const s = selected && sessionById(selected);
    const chip = $("chip");
    if (!s) {
      $("title").textContent = "Shepherd"; chip.hidden = true; $("resumeBtn").hidden = true; $("closeBtn").hidden = true;
      showPlaceholder(sessions.length ? "Pick a session." : "No sessions yet.\nStart one with + New.");
      return;
    }
    const kind = stateOf(s);
    $("title").textContent = s.title;
    chip.hidden = false; chip.className = kind; chip.textContent = labelOf(kind, s);
    $("closeBtn").hidden = false;
    const live = !!holderOf(s.id);
    $("resumeBtn").hidden = live || kind !== "interrupted";
    if (live) { hidePlaceholder(); }
    else if (kind === "interrupted") { showPlaceholder("This session was interrupted (the Mac restarted or its holder stopped).\nResume continues the same conversation."); }
    else { showPlaceholder("Connecting…"); }
  }
  function showPlaceholder(text) { $("placeholderText").textContent = text; $("placeholderText").style.whiteSpace = "pre-line"; $("placeholder").classList.add("show"); $("termWrap").style.visibility = "hidden"; }
  function hidePlaceholder() { $("placeholder").classList.remove("show"); $("termWrap").style.visibility = "visible"; }

  // ---- selecting and attaching --------------------------------------------------------------------
  function select(id, { announce }) {
    selected = id;
    render();
    ensureAttached();
    // Tell the backend someone has looked at it (finished sessions stop counting as unseen). The reply asks the host to
    // show the session, which comes back as `shepherd.show` and does not announce again.
    if (announce) fetch("/api/sessions/" + encodeURIComponent(id) + "/focus", { method: "POST" }).then(refresh).catch(() => {});
  }
  function ensureAttached() {
    if (pendingSelectHolder) {
      const h = holders.find((x) => x.id === pendingSelectHolder);
      if (h && h.claudeSessionID) { pendingSelectHolder = null; selected = h.claudeSessionID; refresh(); }
    }
    const h = selected && holderOf(selected);
    if (!h) {
      if (attachedHolder) { sendCtl({ type: "detach" }); attachedHolder = null; }
      renderHeader();
      return;
    }
    if (attachedHolder === h.id) { hidePlaceholder(); return; }
    if (attachedHolder) sendCtl({ type: "detach" });
    attachedHolder = h.id;
    term.reset();
    hidePlaceholder();
    try { fit.fit(); } catch {}
    const d = proposed();
    sendCtl({ type: "attach", id: h.id, cols: d.cols, rows: d.rows });
    setTimeout(() => sendCtl({ type: "resize", cols: d.cols, rows: d.rows }), 50);
    renderHeader();
  }
  function selectByIndex(n) { const s = sessions[n]; if (s) select(s.id, { announce: true }); }

  $("resumeBtn").addEventListener("click", () => {
    if (!selected) return;
    $("resumeBtn").disabled = true;
    fetch("/api/sessions/" + encodeURIComponent(selected) + "/focus", { method: "POST" })
      .then(() => { let n = 0; const poll = setInterval(() => { sendCtl({ type: "list" }); refresh(); if (++n > 12 || (selected && holderOf(selected))) { clearInterval(poll); $("resumeBtn").disabled = false; } }, 500); })
      .catch(() => { $("resumeBtn").disabled = false; });
  });
  $("closeBtn").addEventListener("click", () => {
    if (!selected) return;
    const s = sessionById(selected);
    if (!window.confirm('End "' + (s ? s.title : "this session") + '"?')) return;
    fetch("/api/sessions/" + encodeURIComponent(selected) + "/close", { method: "POST" }).then(() => { attachedHolder = null; selected = null; term.reset(); refresh(); }).catch(() => {});
  });

  // ---- new session --------------------------------------------------------------------------------
  function openSheet() {
    $("sheetError").textContent = ""; $("sheetTitle").value = "";
    fetch("/api/projects").then((r) => r.json()).then((list) => {
      const sel = $("proj"); sel.textContent = "";
      for (const p of list) { const o = document.createElement("option"); o.value = p.path; o.textContent = p.name; if (p.is_default) o.selected = true; sel.appendChild(o); }
    }).catch(() => {});
    $("sheetBack").classList.add("show");
    setTimeout(() => $("proj").focus(), 30);
  }
  function closeSheet() { $("sheetBack").classList.remove("show"); if (document.hasFocus()) term.focus(); }
  $("newBtn").addEventListener("click", openSheet);
  $("sheetCancel").addEventListener("click", closeSheet);
  $("sheetBack").addEventListener("mousedown", (e) => { if (e.target === $("sheetBack")) closeSheet(); });
  $("sheetStart").addEventListener("click", () => {
    const cwd = $("proj").value; if (!cwd) return;
    const d = proposed(); const title = $("sheetTitle").value.trim();
    $("sheetError").textContent = "";
    const msg = { type: "spawn", cwd, cols: d.cols, rows: d.rows }; if (title) msg.title = title;
    sendCtl(msg);
  });
  $("sheet").addEventListener("keydown", (e) => { if (e.key === "Enter") $("sheetStart").click(); if (e.key === "Escape") closeSheet(); });

  // ---- keyboard -----------------------------------------------------------------------------------
  window.addEventListener("keydown", (e) => {
    if (e.metaKey && !e.ctrlKey && !e.altKey) {
      if (/^[1-9]$/.test(e.key)) { e.preventDefault(); selectByIndex(Number(e.key) - 1); }
      else if (e.key === "n") { e.preventDefault(); openSheet(); }
    }
    if (e.key === "Escape" && $("sheetBack").classList.contains("show")) closeSheet();
  }, true);

  // ---- the native host ----------------------------------------------------------------------------
  window.shepherd = {
    /** The host asks to show a session (a notification, the hotkey, "go to" in the panel). */
    show(id) { if (view !== "sessions") setView("sessions"); if (id) { if (!sessionById(id)) { refresh(); } selected = id; render(); ensureAttached(); } if (document.hasFocus()) term.focus(); },
    focusTerminal() { term.focus(); },
  };


  // ---- views --------------------------------------------------------------------------------------
  let view = "sessions";
  function setView(v) {
    view = v;
    document.body.classList.toggle("board", v === "board");
    $("tabSessions").classList.toggle("on", v === "sessions");
    $("tabBoard").classList.toggle("on", v === "board");
    if (v === "board") { loadTasks(); loadProjectChoices(); }
    else { setTimeout(() => { try { fit.fit(); } catch {} onResize(); if (document.hasFocus()) term.focus(); }, 30); }
  }
  $("tabSessions").addEventListener("click", () => setView("sessions"));
  $("tabBoard").addEventListener("click", () => setView("board"));

  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 4500);
  }
  async function api(path, method, body) {
    const r = await fetch(path, { method: method || "GET", headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    let data = null; try { data = await r.json(); } catch {}
    if (!r.ok) throw new Error((data && data.error) || ("request failed (" + r.status + ")"));
    return data;
  }

  // ---- board --------------------------------------------------------------------------------------
  const COLUMNS = [
    { id: "inbox", label: "Inbox", status: "inbox" }, { id: "ready", label: "Ready", status: "ready" },
    { id: "needs", label: "Needs you", status: null }, { id: "progress", label: "In progress", status: "active" },
    { id: "review", label: "Review", status: "review" }, { id: "done", label: "Done", status: "done" },
  ];
  const FLOW = ["inbox", "ready", "active", "review", "done"];
  let tasks = [], boardSel = null /* {kind:"task"|"session", id} */, drawerId = null, boardTimer = null;

  const folder = (p) => (p || "").split("/").filter(Boolean).pop() || "";
  const sessionsOf = (t) => sessions.filter((x) => x.task_id === t.id);
  const untracked = () => sessions.filter((x) => x.task_id == null || !tasks.some((t) => t.id === x.task_id));
  const needsYou = (kind) => kind === "blocked" || kind === "done" || kind === "interrupted";
  function columnOf(t) {
    if (t.status === "inbox") return "inbox";
    if (t.status === "ready") return "ready";
    if (t.status === "review") return "review";
    if (t.status === "done") return "done";
    return sessionsOf(t).some((x) => needsYou(stateOf(x))) ? "needs" : "progress";
  }
  function bestState(list) {
    for (const k of ["blocked", "interrupted", "done", "working", "idle", "unknown"]) { const f = list.find((x) => stateOf(x) === k); if (f) return { kind: k, session: f }; }
    return null;
  }
  const stateText = (k) => ({ blocked: "Needs you", done: "Finished", working: "Working", interrupted: "Interrupted", idle: "Idle", unknown: "Starting" }[k] || k);

  async function loadTasks() {
    try { tasks = await api("/api/tasks"); } catch { return; }
    renderBoard();
    if (drawerId != null) loadDrawer(drawerId, true);
  }

  function chip(kind, text) {
    const c = document.createElement("span"); c.className = "chipSm";
    const d = document.createElement("span"); d.className = "dot " + kind;
    c.append(d, document.createTextNode(text)); return c;
  }

  function taskCard(t) {
    const el = document.createElement("div");
    el.className = "card" + (boardSel && boardSel.kind === "task" && boardSel.id === t.id ? " sel" : "");
    el.dataset.key = "task:" + t.id;
    el.draggable = true;
    const title = document.createElement("div"); title.className = "cardTitle";
    const num = document.createElement("span"); num.className = "num"; num.textContent = "#" + t.id;
    title.append(num, document.createTextNode(t.title)); el.appendChild(title);
    if (t.objective) { const o = document.createElement("div"); o.className = "cardObj"; o.textContent = t.objective; el.appendChild(o); }
    const meta = document.createElement("div"); meta.className = "cardMeta";
    if (t.progress_total > 0) {
      const bar = document.createElement("span"); bar.className = "bar";
      const i = document.createElement("i"); i.style.width = Math.round(100 * t.progress_done / t.progress_total) + "%"; bar.appendChild(i);
      const n = document.createElement("span"); n.textContent = t.progress_done + "/" + t.progress_total;
      meta.append(bar, n);
    }
    const live = bestState(sessionsOf(t));
    if (live) meta.appendChild(chip(live.kind, stateText(live.kind)));
    else if (t.status === "active") meta.appendChild(chip("idle", "No live session"));
    if (t.project_path) { const f = document.createElement("span"); f.textContent = folder(t.project_path); meta.appendChild(f); }
    if (t.pr) { const a = document.createElement("a"); a.className = "pr"; a.href = t.pr; a.textContent = "PR"; a.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); openLink(t.pr); }); meta.appendChild(a); }
    el.appendChild(meta);
    el.addEventListener("click", () => selectCard({ kind: "task", id: t.id }, true));
    el.addEventListener("dblclick", () => startTask(t));
    el.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", String(t.id)); e.dataTransfer.effectAllowed = "move"; el.classList.add("dragging"); });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
    return el;
  }

  function untrackedCard(x) {
    const el = document.createElement("div");
    el.className = "card untracked" + (boardSel && boardSel.kind === "session" && boardSel.id === x.id ? " sel" : "");
    el.dataset.key = "session:" + x.id;
    const title = document.createElement("div"); title.className = "cardTitle"; title.textContent = x.title; el.appendChild(title);
    const meta = document.createElement("div"); meta.className = "cardMeta";
    meta.appendChild(chip(stateOf(x), stateText(stateOf(x))));
    const f = document.createElement("span"); f.textContent = "no task · " + folder(x.working_directory); meta.appendChild(f);
    el.appendChild(meta);
    const actions = document.createElement("div"); actions.className = "cardActions";
    const open = document.createElement("button"); open.className = "btn"; open.textContent = "Open";
    open.addEventListener("click", (e) => { e.stopPropagation(); openSession(x.id); });
    const promote = document.createElement("button"); promote.className = "btn"; promote.textContent = "Make a task";
    promote.addEventListener("click", async (e) => { e.stopPropagation(); try { const t = await api("/api/tasks/from-session", "POST", { session_id: x.id }); await loadTasks(); selectCard({ kind: "task", id: t.id }, true); } catch (err) { toast(err.message); } });
    actions.append(open, promote); el.appendChild(actions);
    el.addEventListener("click", () => selectCard({ kind: "session", id: x.id }, false));
    el.addEventListener("dblclick", () => openSession(x.id));
    return el;
  }

  let cardKeys = [];   // columns of card keys, for keyboard movement
  function renderBoard() {
    const host = $("columns"); host.textContent = ""; cardKeys = [];
    const byCol = {}; for (const c of COLUMNS) byCol[c.id] = [];
    for (const t of tasks) byCol[columnOf(t)].push({ node: () => taskCard(t), key: "task:" + t.id });
    for (const x of untracked()) byCol[needsYou(stateOf(x)) ? "needs" : "progress"].push({ node: () => untrackedCard(x), key: "session:" + x.id });
    for (const c of COLUMNS) {
      const col = document.createElement("div"); col.className = "col" + (c.id === "needs" ? " needs" : ""); col.dataset.col = c.id;
      const head = document.createElement("div"); head.className = "colHead";
      const h = document.createElement("h3"); h.textContent = c.label; const n = document.createElement("span"); n.textContent = String(byCol[c.id].length);
      head.append(h, n); col.appendChild(head);
      const list = document.createElement("div"); list.className = "cards";
      for (const item of byCol[c.id]) list.appendChild(item.node());
      col.appendChild(list); host.appendChild(col);
      cardKeys.push(byCol[c.id].map((i) => i.key));
      if (c.status) {
        col.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("over"); });
        col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
        col.addEventListener("drop", async (e) => {
          e.preventDefault(); col.classList.remove("over");
          const id = Number(e.dataTransfer.getData("text/plain")); if (!id) return;
          await setStatus(id, c.status);
        });
      }
    }
  }

  function selectCard(sel, openDrawer) {
    boardSel = sel; renderBoard();
    if (sel.kind === "task" && openDrawer) openDrawerFor(sel.id); else if (sel.kind !== "task") closeDrawer();
  }
  async function setStatus(id, status) {
    try { await api("/api/tasks/" + id + "/status", "POST", { status }); await loadTasks(); } catch (e) { toast(e.message); }
  }
  async function startTask(t) {
    try {
      const r = await api("/api/tasks/" + t.id + "/start", "POST");
      await new Promise((res) => { refresh(); setTimeout(res, 700); });
      openSession(r.session_id);
      loadTasks();
    } catch (e) { toast(e.message); }
  }
  function openSession(id) { setView("sessions"); select(id, { announce: true }); }

  // ---- task drawer --------------------------------------------------------------------------------
  function openDrawerFor(id) { drawerId = id; $("drawer").classList.add("show"); loadDrawer(id, false); }
  function closeDrawer() { drawerId = null; $("drawer").classList.remove("show"); }
  $("drawerClose").addEventListener("click", closeDrawer);
  async function loadDrawer(id, quiet) {
    let t; try { t = await api("/api/tasks/" + id); } catch (e) { if (!quiet) toast(e.message); return; }
    if (drawerId !== id) return;
    $("drawerTitle").textContent = "#" + t.id + " " + t.title;
    const body = $("drawerBody"); body.textContent = "";
    const section = (name) => { const h = document.createElement("h4"); h.textContent = name; body.appendChild(h); };
    if (t.objective) { section("Objective"); const p = document.createElement("p"); p.textContent = t.objective; body.appendChild(p); }
    if (t.plan && t.plan.length) {
      section("Plan  " + t.progress_done + "/" + t.progress_total);
      for (const s of t.plan) { const d = document.createElement("div"); d.className = "step" + (s.done ? " done" : ""); d.textContent = (s.done ? "☑ " : "☐ ") + s.text; body.appendChild(d); }
    } else { section("Plan"); const p = document.createElement("p"); p.style.color = "var(--dim)"; p.textContent = "None yet. The agent writes it as it works."; body.appendChild(p); }
    const live = sessionsOf(t);
    section("Sessions");
    if (!live.length) { const p = document.createElement("p"); p.style.color = "var(--dim)"; p.textContent = t.session_ids.length ? "None running. Start picks the conversation back up." : "None yet."; body.appendChild(p); }
    for (const x of live) { const d = document.createElement("div"); d.className = "sessLink"; d.append(chip(stateOf(x), ""), document.createTextNode(x.title + " · " + stateText(stateOf(x)))); d.addEventListener("click", () => openSession(x.id)); body.appendChild(d); }
    if (t.project_path || t.branch) { section("Where"); const p = document.createElement("p"); p.textContent = [t.project_path, t.branch && ("branch " + t.branch)].filter(Boolean).join("\n"); body.appendChild(p); }
    if (t.log && t.log.length) { section("Log"); for (const l of t.log.slice().reverse().slice(0, 20)) { const d = document.createElement("div"); d.className = "logLine"; d.textContent = l; body.appendChild(d); } }

    const buttons = $("drawerButtons"); buttons.textContent = "";
    const go = document.createElement("button"); go.className = "btn primary";
    go.textContent = live.length ? "Go to session" : (t.session_ids.length ? "Resume" : "Start");
    go.addEventListener("click", () => startTask(t));
    const sel = document.createElement("select");
    for (const st of FLOW) { const o = document.createElement("option"); o.value = st; o.textContent = st === "active" ? "In progress" : st[0].toUpperCase() + st.slice(1); if (st === t.status) o.selected = true; sel.appendChild(o); }
    sel.addEventListener("change", () => setStatus(t.id, sel.value));
    buttons.append(go, sel);
  }

  // ---- new task -----------------------------------------------------------------------------------
  function loadProjectChoices() {
    api("/api/projects").then((list) => {
      const sel = $("newTaskProject"); const keep = sel.value; sel.textContent = "";
      for (const p of list) { const o = document.createElement("option"); o.value = p.is_default ? "" : p.path; o.textContent = p.is_default ? "Default folder" : p.name; sel.appendChild(o); }
      sel.value = keep;
    }).catch(() => {});
  }
  $("newTask").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const title = e.target.value.trim(); if (!title) return;
    try {
      const body = { title }; const project = $("newTaskProject").value; if (project) body.project_path = project;
      const t = await api("/api/tasks", "POST", body);
      e.target.value = ""; await loadTasks(); selectCard({ kind: "task", id: t.id }, true);
    } catch (err) { toast(err.message); }
  });

  // ---- board keyboard -----------------------------------------------------------------------------
  function typing(e) { const t = e.target; return t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA"); }
  window.addEventListener("keydown", (e) => {
    if (e.metaKey && !e.ctrlKey && !e.altKey && e.key === "b") { e.preventDefault(); setView(view === "board" ? "sessions" : "board"); return; }
    if (view !== "board" || typing(e) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { closeDrawer(); return; }
    const where = (() => { if (!boardSel) return null; const key = boardSel.kind + ":" + boardSel.id; for (let c = 0; c < cardKeys.length; c++) { const r = cardKeys[c].indexOf(key); if (r >= 0) return { c, r }; } return null; })();
    const pick = (c, r) => { const key = cardKeys[c] && cardKeys[c][r]; if (!key) return; const [kind, id] = key.split(/:(.*)/s); selectCard({ kind, id: kind === "task" ? Number(id) : id }, kind === "task" && drawerId != null); };
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
      e.preventDefault();
      if (!where) { const c = cardKeys.findIndex((k) => k.length); if (c >= 0) pick(c, 0); return; }
      if (e.key === "ArrowUp") pick(where.c, Math.max(0, where.r - 1));
      else if (e.key === "ArrowDown") pick(where.c, Math.min(cardKeys[where.c].length - 1, where.r + 1));
      else { const step = e.key === "ArrowLeft" ? -1 : 1; let c = where.c + step; while (c >= 0 && c < cardKeys.length && !cardKeys[c].length) c += step; if (c >= 0 && c < cardKeys.length) pick(c, Math.min(where.r, cardKeys[c].length - 1)); }
      return;
    }
    if (!boardSel) return;
    if (e.key === "Enter") { e.preventDefault(); if (boardSel.kind === "task") { const t = tasks.find((x) => x.id === boardSel.id); if (t) startTask(t); } else openSession(boardSel.id); return; }
    if ((e.key === "]" || e.key === "[") && boardSel.kind === "task") {
      const t = tasks.find((x) => x.id === boardSel.id); if (!t) return;
      const i = FLOW.indexOf(t.status) + (e.key === "]" ? 1 : -1);
      if (i >= 0 && i < FLOW.length) setStatus(t.id, FLOW[i]);
    }
  }, true);

  setInterval(() => { if (view === "board") loadTasks(); }, 3000);

  if (location.hash === "#board") setView("board");
  watchEvents();
  connect();
  refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
